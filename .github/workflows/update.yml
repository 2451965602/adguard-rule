name: Update rules

on:
  schedule:
    - cron: "0 2 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install parser dependency
        run: python -m pip install -r requirements.txt
      - name: Merge public filters
        run: python merge_rules.py
      - name: Commit changes
        run: |
          git add rules.txt
          if ! git diff --cached --quiet -- rules.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update aggregated rules"
            git push
          fi
